<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grady's Wishlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <p class="eyebrow">🎂 Almost 12!</p>
    <h1>Grady's Wishlist</h1>
    <p class="subtitle">Tap "Claim" if you're getting one of these — so nobody doubles up!</p>
  </header>

  <main class="gift-grid" id="gift-grid">
    <!-- Gift cards get added here by JavaScript -->
    <p class="loading">Loading wishlist...</p>
  </main>

  <footer>
    <p>Made by Grady 🛠️</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
