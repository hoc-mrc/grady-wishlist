<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grady's Wishlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate" style="display:none">
    <h1>Grady's Wishlist 🎁</h1>
    <p>Enter the access code to view the list.</p>
    <form id="gate-form">
      <input id="gate-input" type="password" placeholder="Access code" autocomplete="off" />
      <button id="gate-submit" type="submit">Enter</button>
      <p id="gate-error"></p>
    </form>
  </div>

  <div id="app" style="display:none">
    <header class="hero">
      <p class="eyebrow">🎂 Almost 12!</p>
      <h1>Grady's Wishlist</h1>
      <p class="subtitle">Tap "Claim" if you're getting one of these — so nobody doubles up!</p>
    </header>

    <main class="gift-grid" id="gift-grid">
      <p class="loading">Loading wishlist...</p>
    </main>

    <footer>
      <p>Made by Grady 🛠️</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
